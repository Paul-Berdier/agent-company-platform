name: Preparation finale ACP 1.0.1

"on":
  push:
    branches: ["diagnostic/railway-pid1-26"]
    paths: [".github/workflows/diagnostic-pid1.yml"]

permissions:
  contents: read

jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: pilote
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: fix/railway-init-1.0.1
          path: depot
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Appliquer le correctif exact et reconstruire les bundles
        working-directory: depot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 824cf0e81534c3039fd93741f12c4daa761dc80a
          python - <<'PY'
          import base64, gzip, hashlib, pathlib
          b64=pathlib.Path('../pilote/acp26-release-polish.b64').read_text().strip()
          b64=b64.replace('+UFea6u3gqVUV', '+UFea6zgqVUV').replace('kyzoY439cyiQ', 'kyzoY42cyiQ')
          patch=gzip.decompress(base64.b64decode(b64,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='e573998df7b575cc6f68f70ad7c4d09b1875d4233d7d01cf5baae56aa3ace2b0'
          pathlib.Path('/tmp/acp26-polish.patch').write_bytes(patch)
          PY
          git apply --check /tmp/acp26-polish.patch
          git apply --index /tmp/acp26-polish.patch
          npm ci --prefix apps/interface
          npm run build --prefix apps/interface
          npm run check --prefix apps/interface
          for plugin in acp-interface acp-catalogue acp-projets acp-poste-vues acp-discussion; do
            git add "hermes/plugins/$plugin/dashboard/dist/index.js" "hermes/plugins/$plugin/dashboard/dist/style.css"
          done
          git diff --cached --check
          python scripts/check_version.py
          python scripts/check_engine_frozen.py
          npm ci --ignore-scripts --prefix .railway
          npm run --prefix .railway verifier
          git diff --cached --stat
          git config user.name Personne
          git config user.email 71020676+Paul-Berdier@users.noreply.github.com
          git commit -m 'fix(release): synchronize assertions and document platform supervision'
          git push origin HEAD:refs/heads/fix/railway-init-1.0.1
          git log -1 --format=fuller
          mkdir -p /tmp/acp-101-source
          git archive --format=tar.gz HEAD > /tmp/acp-101-source/source.tar.gz
          git bundle create /tmp/acp-101-source/history.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: acp-101-source
          path: /tmp/acp-101-source/
          retention-days: 3
