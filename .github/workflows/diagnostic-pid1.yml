name: Diagnostic PID 1

"on":
  push:
    branches: ["diagnostic/railway-pid1-26"]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archiver uniquement les sources suivies
        run: |
          mkdir -p /tmp/acp-26-sources
          git archive --format=tar.gz HEAD > /tmp/acp-26-sources/source.tar.gz
          git bundle create /tmp/acp-26-sources/history.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: acp-26-sources
          path: /tmp/acp-26-sources/
          retention-days: 3
      - name: Extraire les scripts de l'image epinglee, sans comptes
        shell: bash
        run: |
          set -euo pipefail
          image='nousresearch/hermes-agent:v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7'
          docker pull "$image"
          mkdir -p /tmp/acp-26-runtime
          docker image inspect "$image" > /tmp/acp-26-runtime/image.json
          docker create --name acp-26-source --entrypoint /bin/true "$image"
          for path in /opt/hermes/docker /etc/cont-init.d /etc/s6-overlay /etc/fix-attrs.d /opt/hermes/scripts; do
            mkdir -p "/tmp/acp-26-runtime$(dirname "$path")"
            docker cp "acp-26-source:$path" "/tmp/acp-26-runtime$path" || exit 1
          done
          docker cp acp-26-source:/package/admin/s6-overlay /tmp/acp-26-runtime/s6-overlay
          docker rm acp-26-source
          tar -czf /tmp/acp-26-runtime.tar.gz -C /tmp/acp-26-runtime .
      - uses: actions/upload-artifact@v4
        with:
          name: acp-26-runtime
          path: /tmp/acp-26-runtime.tar.gz
          retention-days: 3
