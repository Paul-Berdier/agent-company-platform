name: CI

# Refonte « Hermes au centre » : quatre volets.
#   - moteur : gel de packages/pixel-office-engine sur l'étiquette d'archive, puis ses
#     tests npm ;
#   - interface (étapes P3 et P4) : greffons acp-interface, acp-catalogue et acp-projets
#     (apps/interface), tests et bundles committés à jour ;
#   - poste : pytest sur apps/poste, le contrat partagé et l'outillage, sous Linux et
#     sous Windows ;
#   - desktop : workflow séparé desktop-ci.yml (windows-2022).
# Chaque étape de la refonte arrive par une PR refonte/hermes-pN vers refonte/hermes ;
# la PR finale va de refonte/hermes vers main.

"on":
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - "refonte/hermes"
  push:
    branches:
      - main
      - "refonte/**"

permissions:
  contents: read

concurrency:
  # Hors PR : un groupe PAR EXÉCUTION, jamais annulée ni remplacée, comme image.yml. « Wait for CI »
  # de Railway ignore un run annulé dès qu'un autre workflow du commit a réussi
  # (rw_full.txt:29704-29707) : un push qui annulerait le run précédent laisserait déployer ce
  # commit sans verdict de ci.yml (relecture P2). En PR seulement, un nouveau push remplace le run.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  moteur:
    name: Moteur Pixel Office — gel et tests (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique et étiquettes : la garde compare l'arbre à
          # archive/acp-0.10.0-avant-hermes.
          fetch-depth: 0
      - name: Vérifier le gel du moteur
        run: |
          git diff --exit-code archive/acp-0.10.0-avant-hermes -- \
            packages/pixel-office-engine apps/web/public/assets plugins
          python3 scripts/check_engine_frozen.py
      - name: Vérifier les blancs des commits
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git show --check --format=fuller HEAD
          fi
      - name: Balayer les secrets (fichiers suivis et lignes ajoutées par la branche)
        # scripts/balayer_secrets.py : motifs de clés et de jetons, extraits masqués ; relecture de P3
        # (la preuve « aucun secret » reposait sur un script hors dépôt). L'historique complet est
        # là (fetch-depth: 0) : un secret committé puis retiré est trouvé aussi.
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            plage="origin/${{ github.base_ref }}..HEAD"
          else
            plage="origin/main..HEAD"
          fi
          python3 scripts/balayer_secrets.py --arbre --plage "$plage"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Installer les paquets npm (verrou)
        run: npm ci
      - name: Tester le moteur
        run: npm run test:engine

  interface:
    # Étapes P3 et P4 : greffons acp-interface, acp-catalogue et acp-projets du tableau de bord de
    # Hermes. Sources dans apps/interface (hors des workspaces npm de la racine), bundles COMMITTÉS
    # sous hermes/plugins (l'image les copie tels quels) : ils doivent correspondre exactement aux
    # sources.
    name: Interface ACP — greffons du tableau de bord (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/interface/package-lock.json
      - name: Installer les dépendances (verrou, sans scripts d'installation)
        run: npm ci --ignore-scripts --prefix apps/interface
      - name: Types et tests (TypeScript, Vitest, chaînes, garde statique)
        run: npm test --prefix apps/interface
      - name: Bundles committés à jour
        run: |
          set -euo pipefail
          npm run build --prefix apps/interface
          git diff --exit-code -- hermes/plugins/acp-interface hermes/plugins/acp-catalogue \
            hermes/plugins/acp-projets
          reste="$(git status --porcelain -- hermes/plugins/acp-interface hermes/plugins/acp-catalogue \
            hermes/plugins/acp-projets)"
          if [ -n "$reste" ]; then
            echo "Fichiers de greffon non committés : ${reste}" >&2
            exit 1
          fi
          echo "Bundles des greffons identiques aux sources."

  poste:
    name: Poste — Python 3.12 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Le poste vise Windows (Job Object, DPAPI) : ses chemins Windows ne sont
        # exercés que sur windows-2022 ; ubuntu garde la référence historique.
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/python-3.12.lock.txt
      - name: Vérifier les versions publiables
        run: python scripts/check_version.py
      - name: Vérifier le thème généré et le QML du desktop (design/tokens)
        run: python scripts/generer_themes.py --check
      - name: Vérifier le catalogue de skills et de MCP (verrou, licences, collisions, garde)
        # Hors ligne ; la comparaison avec les dépôts amont (--amont, réseau) tourne dans image.yml.
        run: python scripts/verifier_catalogue.py
      - name: Installer les paquets Python (verrou haché)
        # Aucun résolveur : les distributions locales s'installent sans dépendances
        # ni environnement de construction téléchargé.
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/python-3.12.lock.txt
          python -m pip install --no-deps --no-build-isolation \
            -e hermes/plugins/acp-poste/contrat \
            -e apps/poste
          python -m pip check
      - name: Vérifier les déclarations et le verrou Python
        run: python scripts/check_lock.py
      - name: Exécuter les tests Python
        run: python -m pytest -q
