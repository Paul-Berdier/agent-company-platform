name: CI

"on":
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
      - "feat/**"
      - "fix/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  poste:
    name: Poste — Python 3.12 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Le poste vise Windows (Job Object, DPAPI) : ses chemins Windows ne sont
        # exercés que sur windows-2022 ; ubuntu garde la référence historique.
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/python-3.12.lock.txt
      - name: Verify release versions
        run: python scripts/check_version.py
      - name: Install Python packages
        # Verrou haché, aucun résolveur : les distributions locales s'installent sans
        # dépendances ni environnement de construction téléchargé.
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/python-3.12.lock.txt
          python -m pip install --no-deps --no-build-isolation \
            -e hermes/plugins/acp-poste/contrat \
            -e apps/poste
          python -m pip check
      - name: Verify Python dependency declarations and lock
        run: python scripts/check_lock.py
      - name: Run Python tests
        run: python -m pytest -q

  engine:
    name: Pixel Office engine — Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Node packages
        run: npm ci
      - name: Check committed whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git show --check --format=fuller HEAD
          fi
      - name: Test the Pixel Office engine
        run: npm run test:engine
