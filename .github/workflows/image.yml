name: Image Hermes

# Refonte « Hermes au centre », étape P1 : construit l'image Railway d'ACP, dérivée de
# l'image officielle de Hermes Agent épinglée par condensat, et prouve son contrat :
#   - condensat de la base relevé par `docker buildx imagetools inspect` et comparé à
#     hermes/contrat/HERMES_VERSION ; depuis P9, répétition à blanc de la montée de version
#     (scripts/monter_hermes.py verifier : tout l'épinglage reproduit à l'octet près) ;
#   - `hermes --version`, `hermes plugins compat` (greffon acp-poste accepté, témoin
#     refusé) ;
#   - pytest DANS l'image de test (gardes de démarrage, managed scope, adaptateur kanban,
#     route meta, comportement de Hermes face à un /opt/data piégé) ;
#   - tests de contrat pilotés depuis l'hôte : refus de démarrer, PID 1, passerelle et
#     tableau de bord, api_server en boucle locale, fournisseur OIDC seul, route meta
#     authentifiée par un faux fournisseur d'identité, carte en triage jamais lancée ;
#   - défense contre l'agent (uid 10000), prouvée sur l'image :
#       * injection dans /opt/data/config.yaml neutralisée par la managed scope, après
#         relance des services par l'agent et après redémarrage du conteneur ;
#       * /run/service et les scripts des passerelles repris par root : pas d'élévation
#         par un service supervisé ; la relance par s6-svc reste possible ;
#       * PATH des scripts root sans répertoire du volume : un faux binaire déposé
#         par l'agent pour chaque commande système n'est jamais exécuté en root ;
#       * api_server ramené en 127.0.0.1 même clé retirée et enrôlé sur 0.0.0.0 par
#         config.yaml ;
#       * HERMES_MANAGED_DIR posée dans /opt/data/.env : relance ET redémarrage refusés
#         (échec fermé) ; greffons de projet et groupés neutralisés.
#     LIMITE ASSUMÉE, NON couverte par un test : sous le même uid, l'agent peut tuer le
#     tableau de bord et prendre le port public 9119 (parade en P2 — voir image.md §10).
#
# Étape P2, fournisseur d'identité (identite/, docs/refonte/identite.md) :
#   - condensat de l'image Authelia relevé et comparé à la ligne FROM de identite/Dockerfile ;
#   - image identite construite, puis tests de contrat test_identite.py : garde root et refus en
#     français, secrets générés une fois, utilisateur unique, politique OIDC, maintenance,
#     compatibilité avec le vrai tableau de bord de Hermes À TRAVERS un bord TLS factice qui imite
#     Railway, mémoire d'Authelia sous premiers facteurs simultanés (valeur consignée) ;
#   - test navigateur hermes/tests/e2e (Playwright aux hachés vérifiés, Chromium téléchargé ici) :
#     passkey par authentificateur WebAuthn virtuel, consentement, rafraîchissement sans 503,
#     PKCE exigé, révocation, refus d'un autre identifiant. ACP_E2E_OBLIGATOIRE=1 : ce test n'est
#     jamais ignoré en CI.
#
# Étape P2, infrastructure Railway (.railway/, docs/refonte/railway.md) :
#   - SDK railway@3.11.0 installé depuis son verrou haché (npm ci --ignore-scripts), isolé du
#     workspace racine ;
#   - `tsc` : railway.ts typé contre le SDK ;
#   - .railway/verifier.mjs : railway.ts évalué comme le fait la CLI Railway ; tant que les libellés
#     des sous-domaines valent leur gabarit, l'évaluation DOIT refuser (échec fermé) ; avec des
#     libellés d'essai, le graphe attendu (2 services, 2 volumes, Wait for CI, Dockerfile, santé,
#     région, limites, aucune Start Command) ;
#   - test_railway_iac_contrat.py (avec les tests de contrat) : les deux images démarrent avec les
#     variables que railway.ts déclare, et leur santé répond sur le PORT déclaré avec l'hôte
#     healthcheck.railway.app ; identite refuse de démarrer sans les variables du propriétaire.
#   Rien n'est planifié ni appliqué ici : `railway config plan/apply` reste au propriétaire seul.
#
# Étape P3, interface française (docs/refonte/interface.md) :
#   - décompte des chaînes de Hermes restées en anglais, mesuré sur les fichiers EXTRAITS de l'image
#     construite (apps/interface/outils/decompte-traductions.mjs), sortie en artefact ;
#   - test navigateur de l'interface (hermes/tests/e2e/test_interface_fr.py) aux formats 390×844 et
#     1440×900 : Accueil et Catalogue d'ACP, verrou du français, thème, aucune requête hors de
#     l'origine, chaînes du catalogue français seulement, axe-core (apps/interface, verrou npm),
#     cibles tactiles ; captures en artefact.
#
# Étape P3, catalogue (docs/refonte/catalogue.md) :
#   - scripts/verifier_catalogue.py --amont : chaque skill vendorisée et chaque LICENSE comparés, octet
#     pour octet, au dépôt amont au commit épinglé (raw.githubusercontent.com), aucun NOTICE amont
#     oublié ;
#   - tests dans l'image et de contrat : skills chargées par skills.external_dirs, skills livrées
#     inertes désactivées, GET /api/skills exactement le catalogue, route /v1/catalogue, context7
#     (faux serveur TLS) derrière la garde, refus d'un serveur MCP stdio ou hors catalogue ;
#   - sonde RÉELLE de context7 (`hermes mcp test context7` sur l'image construite) : NON BLOQUANTE
#     (service tiers), sortie archivée en artefact.
#
# Étape P4, projets autonomes (docs/refonte/projets.md) :
#   - `hermes plugins compat` couvre aussi le noyau du greffon (hermes/plugins/acp-poste/noyau) ;
#   - tests dans l'image : base du greffon, graphe, routage, plafonds, pauses, questions, cartes
#     poste-* étrangères, présence, émetteur de notifications, outils et garde (33 noms), routes ;
#   - tests de contrat (test_projets_contrat.py) sur la pile s6 complète, SANS le PC : répartiteur de
#     la passerelle, workers kanban réels joués par le modèle factice, poste SIMULÉ (API kanban et
#     fonctions du greffon), faux serveur ntfy en HTTPS (ntfy.acp.test) ; aucune notification réelle ;
#   - test navigateur de la page Projets (hermes/tests/e2e/test_projets.py, greffon acp-projets) aux
#     formats 390×844 et 1440×900 : lancer un projet, répondre à une question du poste simulé, suivre
#     l'avancement jusqu'au bout avec le modèle factice, pauses ; captures en artefact.
#
# Étape P5, poste connecté (docs/refonte/poste.md) :
#   - tests dans l'image : schéma v2 et migration concurrente, fournisseur du jeton machine (protocole de Hermes,
#     comparaison à temps constant, panne en 503), routes machine derrière la VRAIE couture par jeton sur un vrai
#     serveur (portées, 401, 403, 409, 413, 415, 422, 429), long-poll (réveil depuis un fil en moins d'une
#     seconde, déconnexion, aucun fil tenu), présence (grâce de redémarrage), routage (liste de secours, politique
#     du poste), routes du propriétaire, bloc « machine » de /v1/meta ;
#   - tests de contrat (test_machine_contrat.py) avec un FAUX POSTE (hermes/tests/outils/faux_poste.py) sur la pile
#     s6 complète : enrôlement, révocation pendant l'attente, notification « hors ligne » unique, redémarrage de
#     Hermes sans notification, aucun jeton dans les journaux ;
#   - test navigateur de la page Poste (hermes/tests/e2e/test_poste.py, greffon acp-poste-vues).
# Étape P6 (côté Hermes) : même travail, mêmes jobs ; s'y ajoutent :
#   - pytest dans l'image : exécution des cartes (test_execution_p6.py), routage de P6 (test_routage_p6.py),
#     migration du schéma 3 (test_migration_v3.py) ;
#   - tests de contrat (test_execution_contrat.py) avec un FAUX EXÉCUTANT (hermes/tests/outils/faux_executant.py)
#     sur la pile s6 complète : carte servie, battement, fin, question, blocage, reprise, arrêt, idempotence ;
#   - test navigateur de l'exécutant (hermes/tests/e2e/test_executant.py) : onglet Poste et revue des fichiers de
#     pilotage.
# Étape P6 (exécutant) : la cible « factice » de executant/Dockerfile (Codex et Claude Code remplacés par des CLI de
# test) est construite ici, et le BOUT EN BOUT (hermes/tests/contrat/test_executant_bout_en_bout.py) fait tourner le
# VRAI exécutant contre l'image Hermes de test : enrôlement, carte exécutée, committée localement et terminée,
# question et reprise du fil, secret en quarantaine, revue refusée puis corrigée, aucun push, aucun jeton dans les
# journaux. L'image de production de l'exécutant (binaires réels) est prouvée par executant.yml.
#
# Rien n'est publié : ni image poussée, ni déploiement. Railway construit lui-même
# hermes/image/Dockerfile et identite/Dockerfile avec « Wait for CI », d'où le déclencheur `push`.
# Ne JAMAIS annuler ce workflow à la main sur la branche déployée : un run annulé ne prouve rien,
# et « Wait for CI » l'ignore dès qu'un autre workflow a réussi sur le commit.

"on":
  workflow_dispatch:
    inputs:
      temoin_etiquette:
        # Étape P9 (cahier P9 § 5.5) : release de Hermes du job « temoin » ; vide, le job ne tourne pas.
        description: "Témoin de montée : release de Hermes à essayer (forme vAAAA.M.J) ; vide : aucun témoin"
        required: false
        default: ""
        type: string
  pull_request:
    branches:
      - main
      - "refonte/hermes"
    paths:
      - "hermes/**"
      - "identite/**"
      - ".railway/**"
      - "apps/interface/**"
      - "scripts/verifier_catalogue.py"
      # Étape P9 : la répétition à blanc de la montée de Hermes relance ce workflow quand l'outil ou une épingle
      # forte hors des chemins ci-dessus change (fixture /v1/meta du desktop).
      - "scripts/monter_hermes.py"
      - "apps/desktop/tests/fixtures/hermes/meta.json"
      - "executant/**"
      - "apps/poste/src/**"
      - "packaging/poste/lancer.py"
      - "requirements/poste-3.12.lock.txt"
      - ".github/workflows/image.yml"
  push:
    branches:
      - main
      - "refonte/**"
    paths:
      - "hermes/**"
      - "identite/**"
      - ".railway/**"
      - "apps/interface/**"
      - "scripts/verifier_catalogue.py"
      - "scripts/monter_hermes.py"
      - "apps/desktop/tests/fixtures/hermes/meta.json"
      - "executant/**"
      - "apps/poste/src/**"
      - "packaging/poste/lancer.py"
      - "requirements/poste-3.12.lock.txt"
      - ".github/workflows/image.yml"

permissions:
  contents: read

concurrency:
  # Hors PR : un groupe PAR EXÉCUTION, jamais annulée ni remplacée. Par défaut (« queue: single »),
  # GitHub annule toute exécution EN ATTENTE du même groupe, même avec cancel-in-progress: false ;
  # or « Wait for CI » de Railway ignore un run annulé dès qu'un autre workflow a réussi sur le
  # commit (rw_full.txt:29704-29707). En PR seulement, un nouveau push remplace le run en cours.
  group: image-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Image ACP — construction et contrat
    runs-on: ubuntu-latest
    # Étape P4 : le contrat des projets autonomes (workers kanban réels, poste simulé) ajoute environ
    # 15 minutes ; 60 minutes ne laissaient plus de marge.
    timeout-minutes: 90
    env:
      ACP_IMAGE: acp-hermes:ci
      ACP_IMAGE_TESTS: acp-hermes-tests:ci
      ACP_IMAGE_IDENTITE: acp-identite:ci
      ACP_IMAGE_EXECUTANT_FACTICE: acp-executant:factice
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Catalogue — fichiers vendorisés identiques aux dépôts amont (réseau)
        run: python3 scripts/verifier_catalogue.py --amont

      - name: Infrastructure Railway — SDK épinglé, typage et évaluation (échec fermé)
        run: |
          set -euo pipefail
          node --version
          npm ci --ignore-scripts --prefix .railway
          npm run --prefix .railway verifier

      - name: Répétition à blanc de la montée de Hermes (épinglage reproduit à l'octet près)
        # Étape P9 (cahier § 5.4) : remplace le seul relevé du condensat d'index, dont elle est un sur-ensemble.
        # scripts/monter_hermes.py verifier relève ce que l'amont publie pour l'étiquette épinglée (condensat
        # d'index et par plate-forme, commit de l'étiquette ; dans l'image tirée PAR CONDENSAT : hermes --version,
        # provenance, OpenRPC, LICENSE, skills livrées), rend chaque épingle forte depuis ce relevé et la compare
        # octet pour octet au dépôt (ligne FROM, HERMES_VERSION, copie de l'OpenRPC, provenances, verrou du
        # catalogue, fixtures). N'écrit rien. Exigés : code 0 et « Aucun écart » dans le journal.
        run: |
          set -euo pipefail
          python3 scripts/monter_hermes.py verifier | tee /tmp/repetition-montee.txt
          grep -q "^Aucun écart : " /tmp/repetition-montee.txt

      - name: Relever le condensat de l'image Authelia
        run: |
          set -euo pipefail
          ligne="$(grep -E '^FROM ' identite/Dockerfile)"
          test "$(grep -cE '^FROM ' identite/Dockerfile)" -eq 1
          reference="${ligne#FROM }"
          image="${reference%@*}"
          attendu="${reference#*@}"
          case "$image" in docker.io/authelia/authelia:*) ;; *) echo "FROM inattendu : ${ligne}" >&2; exit 1 ;; esac
          case "$attendu" in sha256:*) ;; *) echo "FROM sans condensat : ${ligne}" >&2; exit 1 ;; esac
          docker buildx imagetools inspect "$image" | tee /tmp/imagetools-authelia.txt
          if ! grep -Eq "^Digest: +${attendu}$" /tmp/imagetools-authelia.txt; then
            echo "Le condensat publié de ${image} ne correspond plus à ${attendu} : refus." >&2
            exit 1
          fi
          echo "Condensat épinglé confirmé : ${image}@${attendu}"

      - name: Construire l'image ACP
        run: docker build --pull -f hermes/image/Dockerfile -t "$ACP_IMAGE" hermes

      - name: Construire l'image de test
        run: docker build -f hermes/tests/Dockerfile --build-arg IMAGE_ACP="$ACP_IMAGE" -t "$ACP_IMAGE_TESTS" hermes/tests

      - name: Construire la cible factice de l'exécutant (bout en bout ; aucun binaire réel téléchargé)
        run: docker build -f executant/Dockerfile --target factice -t "$ACP_IMAGE_EXECUTANT_FACTICE" .

      - name: Construire l'image du fournisseur d'identité
        run: docker build --pull -t "$ACP_IMAGE_IDENTITE" identite

      - name: Dépendances de l'interface ACP (verrou npm, sans scripts d'installation)
        run: npm ci --ignore-scripts --prefix apps/interface

      - name: Décompte des chaînes de Hermes restées en anglais (fichiers de l'image)
        run: |
          set -euo pipefail
          mkdir -p /tmp/extrait/web /tmp/extrait/locales /tmp/decompte
          id="$(docker create "$ACP_IMAGE")"
          # web/src ENTIER (relecture de P3 : App.tsx, contexts, plugins… comptent aussi).
          for chemin in web/src locales/en.yaml locales/fr.yaml; do
            docker cp "$id:/opt/hermes/$chemin" "/tmp/extrait/$(dirname "$chemin")/"
          done
          docker rm "$id" > /dev/null
          node apps/interface/outils/decompte-traductions.mjs /tmp/extrait \
            --json /tmp/decompte/decompte-traductions.json --markdown /tmp/decompte/decompte-traductions.md

      - name: Décompte des traductions (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: decompte-traductions
          path: /tmp/decompte
          if-no-files-found: error
          retention-days: 30

      - name: hermes --version
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /opt/hermes/.venv/bin/hermes "$ACP_IMAGE" --version | tee /tmp/version.txt
          grep -q "Hermes Agent v$(sed -n 's/^HERMES_VERSION=//p' hermes/contrat/HERMES_VERSION) " /tmp/version.txt

      - name: hermes plugins compat
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /opt/hermes/.venv/bin/hermes "$ACP_IMAGE" \
            plugins compat /opt/hermes/plugins/acp-poste
          set +e
          docker run --rm --entrypoint /opt/hermes/.venv/bin/hermes "$ACP_IMAGE_TESTS" \
            plugins compat /opt/acp-tests/outils/temoin_compat
          code=$?
          set -e
          echo "Code du témoin : ${code} (1 attendu : il importe hermes_cli.kanban_db.connect)"
          test "$code" -eq 1

      - name: Sonde réelle de context7 (non bloquante, service tiers)
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p /tmp/sonde-context7
          date -u +"%Y-%m-%dT%H:%M:%SZ" | tee /tmp/sonde-context7/sonde.txt
          docker run --rm --entrypoint /opt/hermes/.venv/bin/hermes "$ACP_IMAGE" mcp test context7 2>&1 \
            | tee -a /tmp/sonde-context7/sonde.txt
          grep -q "Tools discovered: 2" /tmp/sonde-context7/sonde.txt
          grep -q "resolve-library-id" /tmp/sonde-context7/sonde.txt
          grep -q "query-docs" /tmp/sonde-context7/sonde.txt

      - name: Sonde réelle de context7 (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonde-context7
          path: /tmp/sonde-context7
          if-no-files-found: ignore
          retention-days: 30

      - name: pytest dans l'image
        run: |
          docker run --rm --entrypoint /opt/hermes/.venv/bin/python \
            -e PYTHONPATH=/opt/acp-tests/site "$ACP_IMAGE_TESTS" \
            -m pytest -v -rA /opt/acp-tests/image

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer pytest (hachés vérifiés)
        run: python -m pip install --require-hashes --no-deps -r hermes/tests/requirements-tests.txt

      - name: Tests de contrat des images (Hermes et fournisseur d'identité)
        # Étape P9 (cahier § 3.7) : les tests de restauration tournent dans le job « restauration » (parallèle), ceux de
        # la montée de données dans le job « montee » (workflow_dispatch) ; le résumé de pytest dit combien sont
        # désélectionnés ici.
        run: python -m pytest -s -v -rA hermes/tests/contrat -m "not restauration and not montee"

      - name: Installer Playwright (hachés vérifiés) et Chromium
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-deps -r hermes/tests/requirements-e2e.txt
          python -m playwright install --with-deps chromium

      - name: Tests navigateur (connexion, interface française, pages Projets et Poste ; Playwright, WebAuthn virtuel)
        env:
          ACP_E2E_OBLIGATOIRE: "1"
          ACP_E2E_CAPTURES: /tmp/captures-e2e
        run: python -m pytest -s -v -rA hermes/tests/e2e -m "not restauration and not montee"

      - name: Captures d'écran du test navigateur
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-navigateur
          path: /tmp/captures-e2e
          if-no-files-found: ignore
          retention-days: 14

      - name: Aucun conteneur, volume ni réseau de test ne reste
        if: always()
        run: |
          # Nettoie TOUJOURS, puis ÉCHOUE si quelque chose restait : un reste prouve un défaut de
          # nettoyage des tests (relecture P2 ; l'étape ne faisait que nettoyer).
          restes=0
          reste="$(docker ps -a --filter name=acp-contrat- --format '{{.Names}}')"
          if [ -n "$reste" ]; then
            echo "Conteneurs restants : ${reste}" >&2
            docker rm -f -v $reste >/dev/null
            restes=1
          fi
          volumes="$(docker volume ls -q --filter name=acp-contrat-)"
          if [ -n "$volumes" ]; then
            echo "Volumes restants : ${volumes}" >&2
            docker volume rm -f $volumes >/dev/null
            restes=1
          fi
          reseaux="$(docker network ls -q --filter name=acp-contrat-)"
          if [ -n "$reseaux" ]; then
            echo "Réseaux restants : ${reseaux}" >&2
            docker network rm $reseaux >/dev/null
            restes=1
          fi
          if [ "$restes" -ne 0 ]; then
            echo "Des ressources acp-contrat-* restaient après les tests : nettoyées, mais la CI échoue." >&2
            exit 1
          fi
          echo "Aucun conteneur, volume ni réseau acp-contrat-* ne restait."

  restauration:
    # Étape P9 (cahier P9 § 3.7, décision P9-4) : les tests de restauration (R1 à R4) dans leur PROPRE job, parallèle au
    # job « image » (environ 51 minutes pour un plafond de 90 ; ses constructions prennent moins de 2 minutes) :
    # images reconstruites ici, puis seulement les tests marqués « restauration » (contrat et navigateur), jamais
    # ignorés (ACP_E2E_OBLIGATOIRE=1). Mêmes déclencheurs que le job « image » : « Wait for CI » l'attend aussi.
    name: Restauration — trois volumes, export, identité
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ACP_IMAGE: acp-hermes:ci
      ACP_IMAGE_TESTS: acp-hermes-tests:ci
      ACP_IMAGE_IDENTITE: acp-identite:ci
      ACP_IMAGE_EXECUTANT_FACTICE: acp-executant:factice
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image ACP
        run: docker build --pull -f hermes/image/Dockerfile -t "$ACP_IMAGE" hermes

      - name: Construire l'image de test
        run: docker build -f hermes/tests/Dockerfile --build-arg IMAGE_ACP="$ACP_IMAGE" -t "$ACP_IMAGE_TESTS" hermes/tests

      - name: Construire la cible factice de l'exécutant (aucun binaire réel téléchargé)
        run: docker build -f executant/Dockerfile --target factice -t "$ACP_IMAGE_EXECUTANT_FACTICE" .

      - name: Construire l'image du fournisseur d'identité
        run: docker build --pull -t "$ACP_IMAGE_IDENTITE" identite

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer pytest (hachés vérifiés)
        run: python -m pip install --require-hashes --no-deps -r hermes/tests/requirements-tests.txt

      - name: Restauration — tests de contrat (R1, R2, R4)
        run: python -m pytest -s -v -rA hermes/tests/contrat -m restauration

      - name: Installer Playwright (hachés vérifiés) et Chromium
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-deps -r hermes/tests/requirements-e2e.txt
          python -m playwright install --with-deps chromium

      - name: Restauration — test navigateur (R3, identité restaurée et reconnexion)
        env:
          ACP_E2E_OBLIGATOIRE: "1"
          ACP_E2E_CAPTURES: /tmp/captures-restauration
        run: python -m pytest -s -v -rA hermes/tests/e2e -m restauration

      - name: Captures d'écran de la restauration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-restauration
          path: /tmp/captures-restauration
          if-no-files-found: ignore
          retention-days: 14

      - name: Aucun conteneur, volume ni réseau de test ne reste (restauration)
        if: always()
        run: |
          # Même contrôle que le job « image » : nettoie TOUJOURS, puis ÉCHOUE si quelque chose restait.
          restes=0
          reste="$(docker ps -a --filter name=acp-contrat- --format '{{.Names}}')"
          if [ -n "$reste" ]; then
            echo "Conteneurs restants : ${reste}" >&2
            docker rm -f -v $reste >/dev/null
            restes=1
          fi
          volumes="$(docker volume ls -q --filter name=acp-contrat-)"
          if [ -n "$volumes" ]; then
            echo "Volumes restants : ${volumes}" >&2
            docker volume rm -f $volumes >/dev/null
            restes=1
          fi
          reseaux="$(docker network ls -q --filter name=acp-contrat-)"
          if [ -n "$reseaux" ]; then
            echo "Réseaux restants : ${reseaux}" >&2
            docker network rm $reseaux >/dev/null
            restes=1
          fi
          if [ "$restes" -ne 0 ]; then
            echo "Des ressources acp-contrat-* restaient après les tests de restauration : nettoyées, mais la CI échoue." >&2
            exit 1
          fi
          echo "Aucun conteneur, volume ni réseau acp-contrat-* ne restait."

  temoin:
    # Étape P9 (cahier P9 § 5.5) : TÉMOIN de montée de version de Hermes. Plus aucune pile Docker ne tourne sur le poste
    # du propriétaire : ce qui se faisait dans un worktree jetable se fait ici, lancé à la main seulement :
    #   gh workflow run image.yml --ref <branche> -f temoin_etiquette=v2026.9.21
    # Dans la copie de travail du runner (jamais committée ni poussée) : scripts/monter_hermes.py ecrire <étiquette>,
    # git diff --stat (seulement les épingles fortes, sinon défaut de l'outil), images (production, test, identité,
    # factice), hermes --version, hermes plugins compat, sonde de démarrage, pytest dans l'image, tests de contrat,
    # suite du dépôt et Vitest, SANS s'arrêter au premier échec (continue-on-error) ; puis le TABLEAU DES ÉCARTS
    # (contrôle → résultat, tests en échec et leur raison) dans le résumé du job et en artefact
    # (scripts/temoin_hermes.py). La borne requires_hermes du greffon n'est JAMAIS modifiée pour « passer ». Le job
    # échoue si un contrôle compté échoue : vert, il dirait que rien ne distingue la release témoin de l'épinglée pour
    # nos contrôles. Les jobs « image » et « restauration » tournent aussi sur ce déclencheur : ils donnent, dans le
    # même run, la référence sur la release épinglée.
    if: github.event_name == 'workflow_dispatch' && inputs.temoin_etiquette != ''
    name: Témoin de montée de Hermes (workflow_dispatch)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ACP_IMAGE: acp-hermes:temoin
      ACP_IMAGE_TESTS: acp-hermes-tests:temoin
      ACP_IMAGE_IDENTITE: acp-identite:temoin
      ACP_IMAGE_EXECUTANT_FACTICE: acp-executant:factice-temoin
      PYTHONUTF8: "1"
      TEMOIN: /tmp/temoin
      # Entrée de l'utilisateur : jamais interpolée dans un script ; lue comme variable, validée avant tout usage.
      TEMOIN_ETIQUETTE: ${{ inputs.temoin_etiquette }}
    steps:
      - uses: actions/checkout@v4

      - name: Étiquette témoin (forme vAAAA.M.J, sinon refus)
        id: etiquette
        run: |
          set -euo pipefail
          mkdir -p "$TEMOIN/journaux" "$TEMOIN/junit"
          if ! [[ "$TEMOIN_ETIQUETTE" =~ ^v[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "Refus : l'étiquette témoin ne suit pas la forme vAAAA.M.J (exemple : v2026.9.21) ; rien n'est lancé." >&2
            exit 2
          fi
          echo "Étiquette témoin : ${TEMOIN_ETIQUETTE} ; épinglée : $(sed -n 's/^HERMES_TAG=//p' hermes/contrat/HERMES_VERSION)."

      - name: Écrire l'épinglage de la release témoin (monter_hermes.py ecrire)
        # Sans continue-on-error : si l'écriture échoue, AUCUN contrôle ne tourne (ils prouveraient l'épinglée sous le
        # nom du témoin) ; le tableau le dit.
        id: ecrire
        run: |
          set -euo pipefail
          python3 scripts/monter_hermes.py ecrire "$TEMOIN_ETIQUETTE" 2>&1 | tee "$TEMOIN/journaux/ecrire.txt"
          if ! grep -qx "HERMES_TAG=${TEMOIN_ETIQUETTE}" hermes/contrat/HERMES_VERSION; then
            echo "Refus : HERMES_TAG ne vaut pas ${TEMOIN_ETIQUETTE} après l'écriture ; aucun contrôle n'est lancé." \
              | tee -a "$TEMOIN/journaux/ecrire.txt" >&2
            exit 1
          fi
          git diff > "$TEMOIN/epinglage-temoin.patch"

      - name: Fichiers réécrits — seulement les épingles fortes (sinon défaut de l'outil)
        id: perimetre
        continue-on-error: true
        run: |
          set -euo pipefail
          git diff --stat | tee "$TEMOIN/journaux/perimetre.txt"
          python3 scripts/temoin_hermes.py perimetre 2>&1 | tee -a "$TEMOIN/journaux/perimetre.txt"

      - name: Concordance de l'épinglage écrit avec la release (monter_hermes.py verifier)
        id: verifier
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/monter_hermes.py verifier --etiquette "$TEMOIN_ETIQUETTE" 2>&1 \
            | tee "$TEMOIN/journaux/verifier.txt"

      - name: Catalogue hors ligne (verrou réécrit)
        id: catalogue
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/verifier_catalogue.py 2>&1 | tee "$TEMOIN/journaux/catalogue.txt"

      - name: Construire l'image ACP (FROM de la release témoin)
        id: image_acp
        continue-on-error: true
        run: |
          set -euo pipefail
          docker build --progress=plain --pull -f hermes/image/Dockerfile -t "$ACP_IMAGE" hermes 2>&1 \
            | tee "$TEMOIN/journaux/image_acp.txt"

      - name: Construire l'image de test
        id: image_tests
        if: steps.image_acp.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          docker build --progress=plain -f hermes/tests/Dockerfile --build-arg IMAGE_ACP="$ACP_IMAGE" \
            -t "$ACP_IMAGE_TESTS" hermes/tests 2>&1 | tee "$TEMOIN/journaux/image_tests.txt"

      - name: Construire la cible factice de l'exécutant (aucun binaire réel téléchargé)
        id: image_factice
        continue-on-error: true
        run: |
          set -euo pipefail
          docker build --progress=plain -f executant/Dockerfile --target factice -t "$ACP_IMAGE_EXECUTANT_FACTICE" . \
            2>&1 | tee "$TEMOIN/journaux/image_factice.txt"

      - name: Construire l'image du fournisseur d'identité
        id: image_identite
        continue-on-error: true
        run: |
          set -euo pipefail
          docker build --progress=plain --pull -t "$ACP_IMAGE_IDENTITE" identite 2>&1 \
            | tee "$TEMOIN/journaux/image_identite.txt"

      - name: hermes --version (Hermes de la release témoin)
        id: version
        if: steps.image_acp.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          set -uo pipefail
          attendu="$(sed -n 's/^HERMES_VERSION=//p' hermes/contrat/HERMES_VERSION)"
          sortie="$(docker run --rm --entrypoint /opt/hermes/.venv/bin/hermes "$ACP_IMAGE" --version 2>&1)"
          code=$?
          { printf '%s\n' "$sortie"; echo "Code : ${code} ; attendu : « Hermes Agent v${attendu} » (HERMES_VERSION écrite)."; } \
            | tee "$TEMOIN/journaux/version.txt"
          test "$code" -eq 0 && printf '%s\n' "$sortie" | grep -q "^Hermes Agent v${attendu} "

      - name: hermes plugins compat — greffon acp-poste (noyau compris)
        id: compat
        if: steps.image_acp.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          set -uo pipefail
          docker run --rm --entrypoint /opt/hermes/.venv/bin/hermes "$ACP_IMAGE" \
            plugins compat /opt/hermes/plugins/acp-poste > /tmp/compat.txt 2>&1
          code=$?
          { cat /tmp/compat.txt; echo "Code : ${code} (0 attendu)"; } | tee "$TEMOIN/journaux/compat.txt"
          exit "$code"

      - name: hermes plugins compat — greffon témoin refusé
        id: compat_temoin
        if: steps.image_tests.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          set -uo pipefail
          docker run --rm --entrypoint /opt/hermes/.venv/bin/hermes "$ACP_IMAGE_TESTS" \
            plugins compat /opt/acp-tests/outils/temoin_compat > /tmp/compat-temoin.txt 2>&1
          code=$?
          { cat /tmp/compat-temoin.txt; echo "Code du témoin : ${code} (1 attendu : il importe hermes_cli.kanban_db.connect)"; } \
            | tee "$TEMOIN/journaux/compat_temoin.txt"
          test "$code" -eq 1

      - name: Démarrage de l'image ACP sur un volume neuf (sonde)
        id: sonde
        if: steps.image_acp.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/temoin_hermes.py sonde --image "$ACP_IMAGE" --prefixe acp-contrat-temoin-sonde \
            --journal-conteneur "$TEMOIN/journaux/sonde-conteneur.txt" 2>&1 | tee "$TEMOIN/journaux/sonde.txt"

      - name: Diagnostic hors verdict — même sonde, variables d'image réclamées par la garde ajoutées
        # Seulement si la sonde a échoué : montre ce qui se cache derrière le premier refus de la garde (variable
        # que l'image amont ne fixe plus). La borne requires_hermes n'est pas touchée.
        id: sonde_diag
        if: steps.sonde.outcome == 'failure'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/temoin_hermes.py sonde --image "$ACP_IMAGE" --prefixe acp-contrat-temoin-diag \
            --variables-de "$TEMOIN/journaux/sonde-conteneur.txt" \
            --journal-conteneur "$TEMOIN/journaux/sonde_diag-conteneur.txt" 2>&1 | tee "$TEMOIN/journaux/sonde_diag.txt"

      - name: pytest dans l'image de test (rapport JUnit)
        id: pytest_image
        if: steps.image_tests.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          set -uo pipefail
          nom=acp-contrat-temoin-pytest-image
          docker run --name "$nom" --entrypoint /opt/hermes/.venv/bin/python \
            -e PYTHONPATH=/opt/acp-tests/site "$ACP_IMAGE_TESTS" \
            -m pytest -v -rA --junitxml=/tmp/junit-image.xml /opt/acp-tests/image 2>&1 \
            | tee "$TEMOIN/journaux/pytest_image.txt"
          code=${PIPESTATUS[0]}
          docker cp "$nom:/tmp/junit-image.xml" "$TEMOIN/junit/pytest-image.xml" \
            || echo "Rapport JUnit introuvable dans le conteneur." | tee -a "$TEMOIN/journaux/pytest_image.txt"
          docker rm -f -v "$nom" > /dev/null
          echo "Code de pytest : ${code}" | tee -a "$TEMOIN/journaux/pytest_image.txt"
          exit "$code"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer pytest (hachés vérifiés)
        run: python -m pip install --require-hashes --no-deps -r hermes/tests/requirements-tests.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: SDK Railway épinglé (lu par les tests de contrat de l'IaC, comme dans le job « image »)
        run: npm ci --ignore-scripts --prefix .railway

      - name: Tests de contrat des images (hors restauration et montée ; rapport JUnit)
        id: contrat
        if: steps.image_acp.outcome == 'success' && steps.image_tests.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m pytest -s -v -rA hermes/tests/contrat -m "not restauration and not montee" \
            --junitxml="$TEMOIN/junit/contrat.xml" 2>&1 | tee "$TEMOIN/journaux/contrat.txt"

      - name: Suite du dépôt hors ligne sur l'épinglage écrit (environnement virtuel, verrou haché)
        id: depot
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m venv /tmp/venv-depot
          {
            /tmp/venv-depot/bin/python -m pip install --require-hashes --no-deps -r requirements/python-3.12.lock.txt
            /tmp/venv-depot/bin/python -m pip install --no-deps --no-build-isolation \
              -e hermes/plugins/acp-poste/contrat -e apps/poste
          } > "$TEMOIN/journaux/depot-installation.txt" 2>&1
          /tmp/venv-depot/bin/python -m pytest -q -rs -p no:cacheprovider --junitxml="$TEMOIN/junit/depot.xml" 2>&1 \
            | tee "$TEMOIN/journaux/depot.txt"

      - name: Interface — types et Vitest sur les fixtures réécrites
        id: interface
        continue-on-error: true
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix apps/interface > "$TEMOIN/journaux/interface-installation.txt" 2>&1
          npm test --prefix apps/interface 2>&1 | tee "$TEMOIN/journaux/interface.txt"

      - name: Tableau des écarts (résumé du job ; le job échoue si un contrôle compté échoue)
        if: always()
        env:
          ETAPES: ${{ toJSON(steps) }}
        run: |
          set +e
          mkdir -p "$TEMOIN"
          python3 scripts/temoin_hermes.py tableau --etapes-env ETAPES --dossier "$TEMOIN" \
            --etiquette="$TEMOIN_ETIQUETTE" --sortie "$TEMOIN/tableau-des-ecarts.md"
          code=$?
          if [ -f "$TEMOIN/tableau-des-ecarts.md" ]; then
            cat "$TEMOIN/tableau-des-ecarts.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"

      - name: Tableau des écarts, journaux, rapports JUnit et correctif d'épinglage (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temoin-montee-hermes
          path: /tmp/temoin
          if-no-files-found: warn
          retention-days: 30

      - name: Aucun conteneur, volume ni réseau de test ne reste (témoin)
        if: always()
        run: |
          # Même contrôle que les jobs « image » et « restauration » : nettoie TOUJOURS, puis ÉCHOUE si quelque chose
          # restait.
          restes=0
          reste="$(docker ps -a --filter name=acp-contrat- --format '{{.Names}}')"
          if [ -n "$reste" ]; then
            echo "Conteneurs restants : ${reste}" >&2
            docker rm -f -v $reste >/dev/null
            restes=1
          fi
          volumes="$(docker volume ls -q --filter name=acp-contrat-)"
          if [ -n "$volumes" ]; then
            echo "Volumes restants : ${volumes}" >&2
            docker volume rm -f $volumes >/dev/null
            restes=1
          fi
          reseaux="$(docker network ls -q --filter name=acp-contrat-)"
          if [ -n "$reseaux" ]; then
            echo "Réseaux restants : ${reseaux}" >&2
            docker network rm $reseaux >/dev/null
            restes=1
          fi
          if [ "$restes" -ne 0 ]; then
            echo "Des ressources acp-contrat-* restaient après le témoin : nettoyées, mais la CI échoue." >&2
            exit 1
          fi
          echo "Aucun conteneur, volume ni réseau acp-contrat-* ne restait."
