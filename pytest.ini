[pytest]
asyncio_mode = auto
addopts = --import-mode=importlib --strict-markers
# Les sources de l'arbre courant priment sur les installations éditables : un
# worktree git teste ainsi son propre code, jamais celui d'un autre checkout.
pythonpath =
    packages/contracts/src
    apps/worker/src
testpaths =
    apps/worker/tests
    packages/contracts/tests
