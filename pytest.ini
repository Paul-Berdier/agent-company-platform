[pytest]
asyncio_mode = auto
addopts = --import-mode=importlib --strict-markers
markers =
    sqlite: test qui exige le moteur SQLite (comportement propre à pysqlite)
    postgres: test qui exige PostgreSQL via ACP_TEST_DATABASE_URL (ignoré sinon, échec si ACP_TEST_DATABASE_REQUIRED=1)
    concurrency: test qui exerce plusieurs connexions ou threads en parallèle
# Les sources de l'arbre courant priment sur les installations éditables : un
# worktree git teste ainsi son propre code, jamais celui d'un autre checkout.
pythonpath =
    packages/contracts/src
    packages/database/src
    packages/provider-sdk/src
    packages/event-sdk/src
    packages/agent-sdk/src
    apps/api/src
    apps/cli/src
    apps/event-service/src
    apps/worker/src
    services/provider-gateway/src
testpaths =
    apps/api/tests
    apps/cli/tests
    apps/event-service/tests
    apps/worker/tests
    packages/contracts/tests
    packages/database/tests
    packages/event-sdk/tests
    services/provider-gateway/tests
