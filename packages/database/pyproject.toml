[project]
name = "acp-database"
version = "0.9.1"
description = "Modèles SQLAlchemy et accès base de l'Agent Company Platform"
requires-python = ">=3.11"
dependencies = ["sqlalchemy>=2.0", "alembic>=1.20,<2", "acp-contracts"]

[project.optional-dependencies]
postgresql = ["psycopg[binary]>=3.2,<4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acp_database = ["migrations/script.py.mako"]
