# Configuration minimale pour la commande « alembic » native.
#
# L'URL de la base n'est volontairement pas renseignée ici : env.py lit
# ACP_DATABASE_URL, et « python -m acp_database.migrate » accepte --database-url.
# Ainsi aucun identifiant ne vit dans un fichier versionné.

[alembic]
script_location = %(here)s/src/acp_database/migrations
sqlalchemy.url =
prepend_sys_path = %(here)s/src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
