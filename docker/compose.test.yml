# PostgreSQL 16 seul, pour la suite de tests PostgreSQL (ACP_TEST_DATABASE_URL).
#
#   docker compose -f docker/compose.test.yml up -d --wait
#   ACP_TEST_DATABASE_URL=postgresql+psycopg://acp:acp@127.0.0.1:5433/acp_test
#   ACP_TEST_DATABASE_REQUIRED=1  python -m pytest -q
#   docker compose -f docker/compose.test.yml down
#
# Données en tmpfs : la base disparaît avec le conteneur, ce qui est voulu pour des
# tests. Les identifiants ``acp/acp`` ne sont jamais réutilisés ailleurs. Le port
# n'est publié que sur le bouclage.

name: acp-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: acp
      POSTGRES_PASSWORD: acp
      POSTGRES_DB: acp_test
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8"
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acp -d acp_test"]
      interval: 2s
      timeout: 3s
      retries: 30
