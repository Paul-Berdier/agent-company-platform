# Pile locale complète : PostgreSQL 16, migration one-shot, api, aperçu, gateway,
# service d'événements, relais d'outbox et web.
#
# Lancement (depuis la racine du dépôt) :
#   cp docker/.env.compose.example docker/.env.compose   # puis renseigner les secrets
#   docker compose -f docker/compose.yml --env-file docker/.env.compose up --build
#
# ``--env-file`` fournit les valeurs interpolées ci-dessous (``${…}``) ; les variables
# obligatoires sont notées ``:?`` et font échouer la commande avec un message clair
# plutôt que de démarrer un service mal configuré. ``env_file:`` (chemin relatif à ce
# fichier) transmet en plus le fichier complet aux services qui partagent la base.
#
# Le volume ``acp-data`` est monté à la fois sur ``api`` et ``artifact-preview`` : c'est
# possible ici, pas sur Railway (voir deploy/railway/README.md).

name: acp

x-python-build: &python-build
  context: ..
  dockerfile: docker/python.Dockerfile
  args:
    ACP_VERSION: ${ACP_VERSION:-0.0.0-unversioned}

x-python-image: &python-image acp-python:${ACP_VERSION:-0.0.0-unversioned}

x-database-env: &database-env
  ACP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-acp}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire dans docker/.env.compose}@postgres:5432/${POSTGRES_DB:-acp}

x-readiness: &readiness
  # L'image slim n'embarque pas curl : la sonde passe par Python. urlopen lève sur
  # tout statut non 2xx, donc un /ready dégradé rend le service « unhealthy ».
  test:
    - CMD
    - python
    - -c
    - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 20s

x-liveness: &liveness
  test:
    - CMD
    - python
    - -c
    - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 10s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire dans docker/.env.compose}
      POSTGRES_DB: ${POSTGRES_DB:-acp}
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8"
    volumes:
      - acp-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    image: *python-image
    build: *python-build
    command: migrate
    restart: "no"
    env_file: .env.compose
    environment:
      <<: *database-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: *python-image
    build: *python-build
    command: api
    env_file: .env.compose
    environment:
      <<: *database-env
      ACP_EVENT_SERVICE_URL: http://event-service:8000
      ACP_PROVIDER_GATEWAY_URL: http://provider-gateway:8000
      ACP_INTERNAL_HTTP_HOSTS: event-service,provider-gateway
      ACP_PLUGINS_DIR: /app/plugins
      ACP_ARTIFACT_STORAGE_DIR: /data/artifacts
      ACP_SKILLS_STORAGE_DIR: /data/skills
    volumes:
      - acp-data:/data
    ports:
      - "127.0.0.1:${ACP_API_PORT:-8000}:8000"
    healthcheck: *readiness
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  artifact-preview:
    image: *python-image
    build: *python-build
    command: preview
    env_file: .env.compose
    environment:
      <<: *database-env
      ACP_ARTIFACT_STORAGE_DIR: /data/artifacts
      ACP_SKILLS_STORAGE_DIR: /data/skills
    volumes:
      - acp-data:/data
    ports:
      - "127.0.0.1:${ACP_PREVIEW_PORT:-8010}:8000"
    healthcheck: *readiness
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  provider-gateway:
    image: *python-image
    build: *python-build
    command: gateway
    environment:
      ACP_GATEWAY_SERVICE_TOKEN: ${ACP_GATEWAY_SERVICE_TOKEN:?ACP_GATEWAY_SERVICE_TOKEN est obligatoire dans docker/.env.compose}
      ACP_CORS_ORIGINS: ${ACP_CORS_ORIGINS:-http://localhost:8080}
      HERMES_BASE_URL: ${HERMES_BASE_URL:-}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      HERMES_TIMEOUT_SECONDS: ${HERMES_TIMEOUT_SECONDS:-30}
      HERMES_MAX_RETRIES: ${HERMES_MAX_RETRIES:-2}
      HERMES_RUN_TIMEOUT_SECONDS: ${HERMES_RUN_TIMEOUT_SECONDS:-120}
      HERMES_POLL_INTERVAL_SECONDS: ${HERMES_POLL_INTERVAL_SECONDS:-0.5}
      ACP_COMFYUI_ENABLED: ${ACP_COMFYUI_ENABLED:-0}
    ports:
      - "127.0.0.1:${ACP_GATEWAY_PORT:-8002}:8000"
    healthcheck: *liveness
    restart: unless-stopped

  event-service:
    image: *python-image
    build: *python-build
    command: event-service
    environment:
      ACP_EVENT_SERVICE_TOKEN: ${ACP_EVENT_SERVICE_TOKEN:?ACP_EVENT_SERVICE_TOKEN est obligatoire dans docker/.env.compose}
      ACP_CORS_ORIGINS: ${ACP_CORS_ORIGINS:-http://localhost:8080}
      ACP_UNSAFE_ALLOW_ANONYMOUS_EVENT_WEBSOCKET: "0"
    ports:
      - "127.0.0.1:${ACP_EVENTS_PORT:-8001}:8000"
    healthcheck: *liveness
    restart: unless-stopped

  relay:
    image: *python-image
    build: *python-build
    command: relay
    env_file: .env.compose
    environment:
      <<: *database-env
      ACP_EVENT_SERVICE_URL: http://event-service:8000
      ACP_INTERNAL_HTTP_HOSTS: event-service
    depends_on:
      migrate:
        condition: service_completed_successfully
      event-service:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: acp-web:${ACP_VERSION:-0.0.0-unversioned}
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        ACP_VERSION: ${ACP_VERSION:-0.0.0-unversioned}
        VITE_ACP_API_URL: ${VITE_ACP_API_URL:?VITE_ACP_API_URL est obligatoire dans docker/.env.compose (URL de l'API vue du navigateur)}
        VITE_ACP_LEGACY_OFFICE: ${VITE_ACP_LEGACY_OFFICE:-0}
    ports:
      - "127.0.0.1:${ACP_WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  acp-postgres:
  acp-data:
