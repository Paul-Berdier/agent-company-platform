# Service statique du SPA web (docker/web.Dockerfile, nginx non privilégié).
#
# - toute route inconnue retombe sur index.html (routeur côté client : /missions,
#   /projects/:id, /ambient…), comme le déclare apps/web/public/_redirects ;
# - index.html n'est jamais mis en cache : c'est lui qui référence les bundles
#   empreints, un index périmé rappellerait des bundles disparus ;
# - les bundles sous /assets/ portent une empreinte dans leur nom et peuvent être
#   cachés longtemps ;
# - X-Content-Type-Options: nosniff partout (add_header n'hérite pas : répété par bloc).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;

    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
