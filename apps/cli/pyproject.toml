[project]
name = "acp-cli"
version = "0.10.0"
description = "CLI officielle de l'Agent Company Platform"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
]

[project.scripts]
acp = "acp_cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
