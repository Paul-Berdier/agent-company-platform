[project]
name = "acp-poste"
version = "0.11.0"
description = "Poste Windows d'ACP : exécuteurs Codex et Claude Code, runner sous Job Object, sondes de quotas"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "acp-poste-contrat",
]

[project.scripts]
acp-poste = "acp_poste.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
