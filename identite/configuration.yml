# ACP — fournisseur d'identité OIDC du tableau de bord Hermes (service Railway « identite »).
#
# Gabarit Authelia 4.39.28 (X_AUTHELIA_CONFIG_FILTERS=template), installé en lecture seule dans
# /etc/authelia/configuration.yml et validé par `authelia config validate` dans les tests de
# contrat (hermes/tests/contrat/test_identite.py). AUCUN secret ici :
#   - les secrets et la clé RS256 sont lus dans /config/secrets (volume), générés au premier
#     démarrage par la garde root acp-identite-entree ;
#   - l'utilisateur UNIQUE est réécrit à chaque démarrage par cette même garde dans
#     /run/acp-identite/utilisateurs.yml (hors volume, root:1000 0640), depuis les variables
#     ACP_IDP_* validées ;
#   - ACP_IDP_DOMAINE, ACP_HERMES_URL et ACP_IDP_UTILISATEUR sont lues par mustEnv : une variable
#     absente fait échouer le rendu, donc le démarrage (échec fermé).
# Documentation : docs/refonte/identite.md.
theme: 'auto'

log:
  level: 'info'

server:
  address: 'tcp://0.0.0.0:9091/'
  # La santé Railway est une requête HTTP sur /api/health. Le HEALTHCHECK Docker amont (script root
  # qui source /app/.healthcheck.env, écrit par Authelia) est retiré de l'image : voir identite/Dockerfile.
  disable_healthcheck: true

totp:
  disable: true

webauthn:
  disable: false
  enable_passkey_login: false
  display_name: 'ACP'
  attestation_conveyance_preference: 'indirect'
  timeout: '60 seconds'
  selection_criteria:
    discoverability: 'preferred'
    user_verification: 'required'

authentication_backend:
  password_reset:
    disable: true
  password_change:
    disable: true
  file:
    path: '/run/acp-identite/utilisateurs.yml'
    watch: false

access_control:
  default_policy: 'two_factor'

session:
  secret: '{{ secret "/config/secrets/session" }}'
  inactivity: '15 minutes'
  expiration: '1 hour'
  cookies:
    - domain: '{{ mustEnv "ACP_IDP_DOMAINE" }}'
      authelia_url: 'https://{{ mustEnv "ACP_IDP_DOMAINE" }}'

regulation:
  modes: ['user']
  max_retries: 5
  find_time: '10 minutes'
  ban_time: '15 minutes'

storage:
  encryption_key: '{{ secret "/config/secrets/stockage" }}'
  local:
    path: '/config/db.sqlite3'

notifier:
  filesystem:
    filename: '/config/notification.txt'

identity_validation:
  reset_password:
    jwt_secret: '{{ secret "/config/secrets/jwt-reinitialisation" }}'

identity_providers:
  oidc:
    hmac_secret: '{{ secret "/config/secrets/oidc-hmac" }}'
    jwks:
      - key_id: 'acp-rs256-1'
        algorithm: 'RS256'
        use: 'sig'
        key: {{ secret "/config/secrets/oidc-rs256.pem" | mindent 10 "|" | msquote }}
    enforce_pkce: 'always'
    enable_pkce_plain_challenge: false
    # Défense en profondeur : Hermes n'a aucune liste blanche de sujets
    # (plugins/dashboard_auth/self_hosted/__init__.py:258-272) ; seul le propriétaire passe.
    authorization_policies:
      proprietaire:
        default_policy: 'deny'
        rules:
          - policy: 'two_factor'
            subject: 'user:{{ mustEnv "ACP_IDP_UTILISATEUR" }}'
    lifespans:
      custom:
        hermes:
          authorize_code: '1 minute'
          id_token: '1 hour'
          access_token: '1 hour'
          # Décision du propriétaire : 7 jours sans reconnexion.
          refresh_token: '7 days'
    claims_policies:
      hermes:
        id_token: ['email', 'name', 'preferred_username']
    clients:
      - client_id: 'hermes-acp'
        client_name: 'Hermes (ACP)'
        public: true
        redirect_uris:
          - '{{ mustEnv "ACP_HERMES_URL" }}/auth/callback'
        scopes: ['openid', 'profile', 'email', 'offline_access']
        grant_types: ['authorization_code', 'refresh_token']
        response_types: ['code']
        # query : le cookie PKCE de Hermes (SameSite=Lax) survit à un GET inter-sites, pas à un form_post.
        response_modes: ['query']
        authorization_policy: 'proprietaire'
        require_pkce: true
        pkce_challenge_method: 'S256'
        token_endpoint_auth_method: 'none'
        revocation_endpoint_auth_method: 'none'
        id_token_signed_response_alg: 'RS256'
        # NB : offline_access impose de toute façon un consentement EXPLICITE à chaque connexion
        # (internal/oidc/util.go:646-669 de la 4.39.28 ; constaté par le test navigateur) : ce mode
        # ne s'applique qu'aux demandes sans offline_access, que Hermes ne fait pas.
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1 month'
        lifespan: 'hermes'
        claims_policy: 'hermes'
