# Managed scope de Hermes pour ACP : modèle de /etc/hermes/config.yaml.
#
# Hermes applique ce fichier en dernier, feuille par feuille, par-dessus
# /opt/data/config.yaml (hermes_cli/managed_scope.py:125-147 ;
# hermes_cli/config.py:2211-2226) ; `hermes config set` refuse toute clé épinglée
# ici (hermes_cli/config.py:3384-3391). Ce que garantit ce fichier tient à la
# permission : /etc/hermes appartient à root (0755, fichiers 0644) et l'agent
# tourne sous l'uid 10000 sans sudo (website/docs/user-guide/managed-scope.md:36-39
# et 139-148 ; Dockerfile:168 de l'image officielle).
#
# Décision du propriétaire du 25 septembre 2026 (étape P2) : AUCUN outil d'exécution
# pour l'agent sur Railway (ni terminal, ni fichiers, ni exécution de code, ni
# navigateur, ni cron, ni délégation, ni connexions). L'exécution passe par le poste
# Windows du propriétaire. Trois couches, dont aucune ne suffit seule :
#   1. les listes de ce fichier (agent.disabled_toolsets et platform_toolsets) ;
#   2. les épingles de /etc/hermes/.env (HERMES_TUI_TOOLSETS, HERMES_BIN,
#      HERMES_ACCEPT_HOOKS… vides ; HERMES_ALLOW_PRIVATE_URLS=false) ;
#   3. le crochet pre_tool_call du greffon acp-poste, en LISTE BLANCHE
#      (hermes/plugins/acp-poste/garde_execution.py). C'est le SEUL verrou de
#      preview.restart, dont l'agent caché reçoit ["terminal","file"] codés en dur
#      (tui_gateway/agent_callbacks.py:371-374).
# Ce qui reste ouvert, et dit : le tableau de bord AUTHENTIFIÉ reste un shell du
# propriétaire (shell.exec, /api/pty, /api/mcp, /api/env, quick_commands…), protégé
# par le seul OIDC mono-utilisateur. Voir docs/refonte/image.md §5 et §10.
#
# L'agent, la passerelle et le tableau de bord tournent sous le MÊME uid (10000) : sans
# outil d'exécution, l'agent ne peut plus s'en servir, mais une faille de Hermes lui-même
# le pourrait encore (limite dite, docs/refonte/image.md §10).
#
# 00-acp-gardes régénère /etc/hermes/config.yaml à chaque démarrage à partir de ce
# modèle, après avoir remplacé les marqueurs de déploiement (chaînes encadrées de
# doubles arobases) par les variables Railway validées, puis refuse de démarrer si le
# résultat ne se relit pas (un fichier géré invalide serait ignoré en silence :
# managed_scope.py:69-96).
# Aucun secret ici : le fichier est lisible par tous.
#
# Toute clé ajoutée ici devient immuable pour l'agent. Les épingles de sécurité
# listées dans hermes/image/acp_demarrage.py (EPINGLES_OBLIGATOIRES) sont
# vérifiées à la construction de l'image et à chaque démarrage.

kanban:
  # Défaut True (config_defaults.py:1907-1909) : à chaque tick, la passerelle
  # décomposerait toute carte en triage par un LLM auxiliaire et la promouvrait
  # (gateway/kanban_watchers.py:296-301), ce qui contournerait la validation.
  auto_decompose: false
  # Défaut None = tout profil existant est lançable ; une liste fait échouer
  # fermé tout autre assigné (config_defaults.py:1901-1906 ;
  # kanban_db_dispatch.py:1636-1700). Les cartes des exécutants du poste
  # (« poste-codex », « poste-claude ») ne sont jamais lancées sur Railway, même
  # si un profil de ce nom était créé : le poste les réclame (étapes P5-P6).
  dispatch_profiles: [default]
  # Étape P4 : le répartiteur de la passerelle fait avancer les projets sans client
  # connecté ; la variable HERMES_KANBAN_DISPATCH_IN_GATEWAY, qui le couperait
  # (gateway/kanban_watchers.py:215-218), est interdite au démarrage.
  dispatch_in_gateway: true
  # Étape P4 : plafond HÔTE de cartes « running » ; les réclamations distantes du
  # poste comptent (kanban_db_dispatch.py:2161-2219).
  max_in_progress: 4
  # Étape P4 : au plus 2 workers Hermes (« default ») à la fois dans les 2 Go.
  max_in_progress_per_profile: 2
  # Étape P4 : aucune relecture sdlc-review automatique ; la relecture est croisée,
  # par l'autre exécutant du poste (greffon acp-poste).
  review_dispatch: false
  # Étape P4 : trois échecs consécutifs avant l'abandon (plan d'autonomie § 6).
  failure_limit: 3
  # Ces réglages sont lus au DÉMARRAGE de la passerelle (gateway/kanban_watchers_dispatcher.py:30-117) :
  # un changement exige une relance. dispatch_interval_seconds n'est pas épinglé (tests : 5 s).

approvals:
  # Défaut « smart » : un modèle auxiliaire approuve seul (config_defaults.py:1656).
  # Valeurs admises : manual, smart, off (tools/approval_context.py:197).
  mode: manual
  cron_mode: deny
  single_query_mode: deny
  unattended_mode: deny

plugins:
  # Aucun greffon « utilisateur » ne peut être activé : tout greffon passe par
  # l'image. acp-poste est un greffon groupé de type « backend », chargé sans
  # figurer dans cette liste (hermes_cli/plugins_discovery.py:264-267), et son
  # API de tableau de bord est montée sans elle (web_server_dashboard.py:782-795).
  # Une liste vide garantit qu'un homonyme déposé sous /opt/data/plugins n'est
  # jamais importé (web_server_dashboard.py:793-794 ;
  # web_routers/dashboard_ui.py:118-128 ; plugins_discovery.py:272-276).
  enabled: []
  # Connexion au tableau de bord par OIDC auto-hébergé seulement (décision du
  # propriétaire). Clés « catégorie/nom » : plugins_discovery.py:238-252 ;
  # plugins_cmd.py:1206.
  disabled:
    - dashboard_auth/basic
    - dashboard_auth/nous
    - dashboard_auth/drain
    # Étape P3 (décision D13) : greffon groupé de gamification, en anglais et doté de sa propre
    # API ; hors du périmètre d'ACP. Un greffon groupé désactivé n'est ni servi au navigateur ni
    # monté (web_routers/dashboard_ui.py:109-146).
    - hermes-achievements
  # Un greffon qui résout un ancien chemin PLUGIN-COMPAT n'est pas chargé
  # (hermes_cli/plugin_compat.py:32 et 296-312 ; COMPAT_MANIFEST.md:15-19).
  allow_deprecated_imports: false

auth:
  # Défaut True : Hermes emprunterait les connexions Codex CLI et Claude Code
  # (config_defaults.py:1719-1724).
  adopt_external_logins: false

security:
  redact_secrets: true
  # Défense en profondeur : url_safety lit config.yaml SANS la managed scope
  # (tools/url_safety.py:145-173) ; la protection effective est
  # HERMES_ALLOW_PRIVATE_URLS=false dans /etc/hermes/.env.
  allow_private_urls: false
  # Défaut True (config_defaults.py:1765 ; tools/lazy_deps.py:325-338). Mesuré le
  # 25/09/2026 : sans cette épingle, la passerelle lance
  # `uv pip install --target /opt/data/lazy-packages edge-tts==7.2.7` dès son démarrage.
  allow_lazy_installs: false

display:
  # Messages statiques seulement (approbations, quelques réponses de passerelle) ;
  # les réponses de l'agent viennent de SOUL.md (config_defaults.py:875-877).
  language: fr

agent:
  # Retrait outil par outil (model_tools.py:334-340) pour la messagerie, le cron, le
  # CLI, les workers kanban et la délégation. L'api_server (api_server.py:2232-2270) et
  # le tableau de bord (tui_gateway/server.py:2451-2468) ne le transmettent PAS à
  # l'AIAgent : d'où les listes platform_toolsets ci-dessous, qui le repassent
  # (tools_config.py:620-627).
  disabled_toolsets: [browser, terminal, file, code_execution, computer_use, connections, cronjob, delegation, setup]
  # Guillemets obligatoires : « off » nu serait lu comme un booléen par PyYAML. « focus »
  # réduirait les outils au jeu de codage (terminal et fichiers) (config_defaults.py:181-185).
  coding_context: "off"
  # Mode rapide coupé (config_defaults.py:134-136) : « "" » = normal. Cohérent avec le
  # plan d'autonomie (P4-P8, §7) ; rien ne le rallume depuis le volume.
  service_tier: ""

# Listes EXPLICITES, sans composite (tools_config.py:576-651) : un composite comme
# hermes-cli rendrait terminal et fichiers. « cli » sert aussi au tableau de bord
# (tui_gateway/server.py:1935-1943), aux workers kanban (kanban_db_dispatch.py:2620-2645)
# et à `hermes -z`. ATTENTION : une liste cli VIDE ferait rendre TOUS les jeux au
# tableau de bord (tui_gateway/server.py:1942). no_mcp : aucun serveur MCP.
# Étape P3 : cli nomme le serveur context7 au lieu de no_mcp. Un nom de serveur dans la liste en
# fait une LISTE BLANCHE : seuls les serveurs nommés sont offerts (tools_config.py:678-690) ;
# api_server et cron gardent no_mcp.
# Étape P4 : cli nomme aussi acp_poste, le jeu des huit outils du greffon acp-poste (projets
# autonomes) ; api_server et cron ne l'ont pas (ci-dessous, known_plugin_toolsets).
platform_toolsets:
  api_server: [web, vision, skills, todo, memory, session_search, no_mcp]
  cli: [web, vision, skills, todo, memory, session_search, clarify, context7, acp_poste]
  cron: [web, vision, skills, todo, memory, session_search, no_mcp]

# Étape P4 (décision D24) : un jeu de greffon « connu » pour une plateforme et absent de sa liste
# est coupé (hermes_cli/tools_config.py:538-545) ; sans ces épingles, les outils du greffon seraient
# actifs par défaut sur api_server et cron.
known_plugin_toolsets:
  api_server: [acp_poste]
  cron: [acp_poste]

# Étape P3 : un seul serveur MCP côté Hermes, context7 (entrée officielle
# optional-mcps/context7/manifest.yaml : serveur DISTANT en HTTP, sans authentification). Aucun
# processus n'est lancé dans le conteneur : `url` l'emporte sur un éventuel `command` posé par le
# volume (tools/mcp_tool_server_run.py:277-279), et 05-acp refuse de démarrer sur tout serveur
# stdio ou hors catalogue du volume. Trois couches : ces épingles (appliquées feuille par feuille
# par-dessus le volume : tools/mcp_tool_config.py:362-381), la liste cli ci-dessus et la garde
# d'exécution d'acp-poste, qui n'admet que les deux outils exacts
# mcp__context7__resolve_library_id et mcp__context7__query_docs. Catalogue :
# hermes/catalogue/catalogue.lock.json.
mcp_servers:
  context7:
    url: https://mcp.context7.com/mcp
    enabled: true
    # Certificat du serveur toujours vérifié (magasin du système épinglé dans /etc/hermes/.env).
    ssl_verify: true
    # Le serveur ne peut ni faire générer le modèle de Hermes (échantillonnage, actif par défaut),
    # ni demander une saisie (élicitation) : tools/mcp_tool_server_run.py:268-276.
    sampling:
      enabled: false
    elicitation:
      enabled: false
    # Seuls les deux outils de documentation sont enregistrés (liste blanche,
    # tools/mcp_tool_registration.py:211-225) ; aucun outil utilitaire de ressources ni de
    # gabarits (tools/mcp_tool_registration.py:150-176).
    tools:
      include: [resolve-library-id, query-docs]
      resources: false
      prompts: false

skills:
  # Aucun !`cmd` exécuté à la lecture d'une skill (config_defaults.py:1442-1446).
  inline_shell: false
  # Toute création ou modification de skill par l'agent est mise en attente de
  # validation par le propriétaire (config_defaults.py:1455-1459).
  write_approval: true
  # Analyse de sécurité des skills écrites par l'agent (config_defaults.py:1447-1450).
  guard_agent_created: true

memory:
  # Toute écriture en mémoire par l'agent attend la validation du propriétaire
  # (config_defaults.py:1292-1295) : la mémoire est injectée dans toutes les sessions.
  write_approval: true

# Aucune inscription automatique des crochets shell `hooks:` (config_defaults.py:1710-1714).
# HERMES_ACCEPT_HOOKS est de plus épinglée vide et interdite ; le répartiteur kanban
# passe toutefois --accept-hooks à ses workers (kanban_db_dispatch.py:2686-2689) : d'où
# le jeu file coupé (l'agent n'écrit plus config.yaml) et `diagnostiquer`.
hooks_auto_accept: false

platforms:
  # api_server de la passerelle : épinglé en boucle locale. Sans clé utilisable dans
  # l'environnement, l'agent peut l'enrôler lui-même par /opt/data/config.yaml
  # (gateway/config_env.py:307-315) et la valeur de config.yaml gagne sur API_SERVER_HOST
  # (gateway/platforms/api_server.py:209-218). En épinglant l'hôte et le port ici, la
  # managed scope (appliquée par-dessus la config du volume) le ramène toujours en
  # 127.0.0.1:8642, y compris après une relance de la passerelle par l'agent.
  api_server:
    extra:
      host: 127.0.0.1
      port: 8642

dashboard:
  # Thème généré depuis design/tokens (scripts/generer_themes.py), déposé par 05-acp.
  theme: acp
  # Étape P3 : police du thème, jamais une police de substitution. Toute autre valeur injecterait
  # une feuille de style distante (Google Fonts, web/src/themes/fonts.ts) ; la valeur épinglée
  # l'emporte sur celle du navigateur au chargement suivant (web/src/themes/context.tsx:519-540).
  font: theme
  # Étape P3 : aucun greffon de tableau de bord masqué ; acp-interface, acp-catalogue et
  # acp-poste restent toujours servis (web_routers/dashboard_ui.py:129-146).
  hidden_plugins: []
  # URL publique https validée par 00-acp-gardes (HERMES_DASHBOARD_PUBLIC_URL).
  public_url: "@@ACP:HERMES_DASHBOARD_PUBLIC_URL@@"
  # Décision P2 : vide tant que la plage du bord Railway n'est pas mesurée (bloc
  # « reseau » de /v1/meta) ; vide, seul le bouclage local est cru
  # (config_defaults.py:988-990 ; web_server_lifecycle.py:440-485).
  trusted_proxies: []
  oauth:
    # Fournisseur Nous écarté : identifiant et portail vides.
    client_id: ""
    portal_url: ""
    # Fournisseur OIDC auto-hébergé (plugins/dashboard_auth/self_hosted/__init__.py:285-310).
    self_hosted:
      issuer: "@@ACP:HERMES_DASHBOARD_OIDC_ISSUER@@"
      client_id: "@@ACP:HERMES_DASHBOARD_OIDC_CLIENT_ID@@"
      scopes: "@@ACP:HERMES_DASHBOARD_OIDC_SCOPES@@"
      # Le secret d'un client confidentiel vient de la variable Railway
      # HERMES_DASHBOARD_OIDC_CLIENT_SECRET, qui gagne sur cette valeur vide
      # (plugins/dashboard_auth/_shared.py:46-49) ; sans elle, client public (PKCE).
      client_secret: ""
  # Fournisseur par mot de passe écarté : aucun identifiant possible.
  basic_auth:
    username: ""
    password: ""
    password_hash: ""
    secret: ""
