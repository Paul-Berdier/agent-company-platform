[pytest]
# Tests de contrat de l'image, pilotés depuis l'hôte : lancés explicitement par
# .github/workflows/image.yml, jamais par la suite du poste (pytest.ini racine).
addopts = --strict-markers -p no:cacheprovider
markers =
    restauration: tests de restauration (étape P9, cahier P9 § 3) : job « restauration » d'image.yml, désélectionnés du job « image »
    montee: montée de données d'une image à la suivante (étape P9, cahier P9 § 5.6) : job « montee » d'image.yml (workflow_dispatch)
