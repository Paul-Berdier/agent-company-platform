# Greffon groupé acp-poste (livré dans l'image, /opt/hermes/plugins/acp-poste).
#
# Type « backend » : un greffon groupé de ce type se charge sans figurer dans
# plugins.enabled (hermes_cli/plugins_discovery.py:264-267), que la managed scope
# épingle vide pour qu'aucun greffon « utilisateur » ne soit jamais activé.
# Route /api/plugins/acp-poste/v1/meta (P1) ; depuis P2, garde d'exécution de l'agent (crochet
# pre_tool_call en liste blanche, garde_execution.py) et sentinelle qui arrête Hermes lancé hors
# de s6 ; depuis P3, route /v1/catalogue (catalogue.py) et blocs catalogue et interface de
# /v1/meta ; depuis P4 (noyau/), projets autonomes : un tableau kanban par projet, les huit outils
# de l'agent (projet_*, poste_*, question_*, routage_surcharger), routes /v1/projets,
# /v1/questions, /v1/pause, /v1/poste et /v1/notifications/test, émetteur de notifications dans la
# passerelle. Le jeton machine et les routes du poste arrivent en P5 (docs/refonte/autonomie.md § 8).
name: acp-poste
version: 0.11.0
description: "ACP — projets autonomes sur Hermes (un tableau par projet, huit outils de l'agent, routes /v1/projets et /v1/questions, émetteur de notifications) et garde d'exécution de l'agent (liste blanche pre_tool_call). Contrat acp-poste/1."
author: ACP
kind: backend
requires_hermes: ">=0.21.5"
