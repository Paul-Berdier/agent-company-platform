# Greffon groupé acp-poste (livré dans l'image, /opt/hermes/plugins/acp-poste).
#
# Type « backend » : un greffon groupé de ce type se charge sans figurer dans
# plugins.enabled (hermes_cli/plugins_discovery.py:264-267), que la managed scope
# épingle vide pour qu'aucun greffon « utilisateur » ne soit jamais activé.
# Route /api/plugins/acp-poste/v1/meta et adaptateur kanban (P1) ; depuis P2, garde
# d'exécution de l'agent (crochet pre_tool_call en liste blanche, garde_execution.py) et
# sentinelle qui arrête Hermes lancé hors de s6. Les outils projet_*, poste_* et
# question_* arrivent en P4, le jeton machine et les routes du poste en P5
# (docs/refonte/autonomie.md § 8).
name: acp-poste
version: 0.11.0
description: "ACP — façade versionnée du poste Windows (contrat acp-poste/1) et garde d'exécution de l'agent (liste blanche pre_tool_call). Route /v1/meta, adaptateur kanban ; aucun outil encore."
author: ACP
kind: backend
requires_hermes: ">=0.21.5"
